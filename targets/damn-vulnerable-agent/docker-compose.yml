services:
  # No se levanta un Ollama propio: se reutiliza el Ollama nativo de la VM
  # (instalado por ~/lab-ia/provision.sh, systemd, escuchando en
  # 127.0.0.1:11434) vía host.docker.internal, para no duplicar el servicio
  # ni los modelos descargados.
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LLM_BACKEND: "${LLM_BACKEND:-ollama}"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.2:3b}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      DB_PATH: "/data/memory.db"
      WORKSPACE_DIR: "/workspace"
      ENABLE_TOOL_SANITIZER: "${ENABLE_TOOL_SANITIZER:-false}"
    volumes:
      - ./data:/data
      - ./workspace:/workspace
